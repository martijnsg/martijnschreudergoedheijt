[build]
  publish = "."

[[redirects]]
  from = "/executiveteambegeleiding/*"
  to = "/executive-teambegeleiding/"
  status = 301

[[redirects]]
  from = "/persoonlijkeontwikkeling/*"
  to = "/persoonlijke-ontwikkeling/"
  status = 301

[[redirects]]
  from = "/executiveteambegeleiding"
  to = "/executive-teambegeleiding/"
  status = 301

[[redirects]]
  from = "/persoonlijkeontwikkeling"
  to = "/persoonlijke-ontwikkeling/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/inspiratie/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/inspiratie/"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
